    const CHAMBER_LABELS = { us_senate: 'US Senate', us_house: 'US House', senate: 'State Senate', assembly: 'Assembly', city_council: 'City Council', nyc_mayor: 'NYC Mayor' };

    function partyColor(p) { if (!p) return '#9ca3af'; p = p.toLowerCase(); return p.includes('democrat') ? '#3b82f6' : p.includes('republican') ? '#ef4444' : '#9ca3af'; }

    async function init() {
      const [legR, posR, critR] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/current_legislators?select=person_id,name,party,chamber,district&order=name`, { headers: { apikey: SUPABASE_ANON_KEY } }),
        fetch(`${SUPABASE_URL}/rest/v1/positions?select=person_id,stance&assessment_type=eq.ai&topic_id=eq.1`, { headers: { apikey: SUPABASE_ANON_KEY } }),
        fetch(`${SUPABASE_URL}/rest/v1/person_criteria?select=person_id,criterion_id,source_date,criteria(label,direction,weight,category)&order=source_date.desc`, { headers: { apikey: SUPABASE_ANON_KEY } }),
      ]);
      const legs = await legR.json();
      const positions = await posR.json();
      const criteria = await critR.json();

      const posMap = {}; for (const p of positions) posMap[p.person_id] = p;

      // Compute scores
      for (const leg of legs) {
        const crit = criteria.filter(c => c.person_id === leg.person_id);
        let score = 0;
        for (const c of crit) { const w = c.criteria?.weight || 1; score += c.criteria?.direction === 'pro' ? w : -w; }
        leg.score = score;
        leg.evidenceCount = crit.length;
        leg.stance = posMap[leg.person_id]?.stance || 'unknown';
      }

      // === ANALYSIS ===
      const totalLegs = legs.length;
      const withEvidence = legs.filter(l => l.evidenceCount > 0).length;
      const proLegs = legs.filter(l => l.stance === 'strongly_support' || l.stance === 'support');
      const antiLegs = legs.filter(l => l.stance === 'strongly_oppose' || l.stance === 'oppose');
      const neutralLegs = legs.filter(l => l.stance === 'neutral');
      const unknownLegs = legs.filter(l => l.stance === 'unknown');

      // By party
      const dems = legs.filter(l => l.party === 'Democratic');
      const reps = legs.filter(l => l.party === 'Republican');
      const demPro = dems.filter(l => l.stance === 'strongly_support' || l.stance === 'support').length;
      const demAnti = dems.filter(l => l.stance === 'strongly_oppose' || l.stance === 'oppose').length;
      const repPro = reps.filter(l => l.stance === 'strongly_support' || l.stance === 'support').length;
      const repAnti = reps.filter(l => l.stance === 'strongly_oppose' || l.stance === 'oppose').length;

      // By chamber
      const chambers = ['us_senate', 'us_house', 'senate', 'assembly', 'city_council'];
      const chamberStats = chambers.map(ch => {
        const chLegs = legs.filter(l => l.chamber === ch);
        const pro = chLegs.filter(l => l.stance === 'strongly_support' || l.stance === 'support').length;
        const anti = chLegs.filter(l => l.stance === 'strongly_oppose' || l.stance === 'oppose').length;
        const avgScore = chLegs.length > 0 ? chLegs.reduce((s, l) => s + l.score, 0) / chLegs.length : 0;
        return { chamber: ch, label: CHAMBER_LABELS[ch], total: chLegs.length, pro, anti, avgScore };
      });

      // Most anti-Israel geographic clusters (City Council districts with anti-Israel reps)
      const antiCC = legs.filter(l => l.chamber === 'city_council' && (l.stance === 'strongly_oppose' || l.stance === 'oppose'))
        .sort((a, b) => a.score - b.score);
      const antiAssembly = legs.filter(l => l.chamber === 'assembly' && (l.stance === 'strongly_oppose' || l.stance === 'oppose'))
        .sort((a, b) => a.score - b.score);

      // Criteria frequency with direction
      const critCounts = {};
      const critDir = {};
      for (const c of criteria) {
        const label = c.criteria?.label || 'Unknown';
        critCounts[label] = (critCounts[label] || 0) + 1;
        critDir[label] = c.criteria?.direction || 'unknown';
      }
      const topCriteria = Object.entries(critCounts).sort((a, b) => b[1] - a[1]).slice(0, 12);

      // DSA / progressive caucus members
      const stronglyAnti = legs.filter(l => l.stance === 'strongly_oppose').sort((a, b) => a.score - b.score);

      // 2026 activity

          <div class="stat-box"><div class="big">${unknownLegs.length}</div><div class="label">No Position</div></div>

        <div class="finding positive"><strong>${Math.round((proLegs.length / withEvidence) * 100)}%</strong> of NY legislators with a public record are pro-Israel. Only <strong>${Math.round((antiLegs.length / withEvidence) * 100)}%</strong> are anti-Israel.</div>
      </div>`;

      // Party breakdown — pie charts
      const demNeutralUnknown = dems.length - demPro - demAnti;
      const repNeutralUnknown = reps.length - repPro - repAnti;

      function pieChart(pro, anti, neutral, total, partyColor) {
        const r = 70, cx = 80, cy = 80;
        const proPct = pro / total, antiPct = anti / total, neutralPct = neutral / total;

        function arc(startAngle, endAngle, color) {
          if (endAngle - startAngle <= 0) return '';
          const large = endAngle - startAngle > Math.PI ? 1 : 0;
          const x1 = cx + r * Math.cos(startAngle - Math.PI/2);
          const y1 = cy + r * Math.sin(startAngle - Math.PI/2);
          const x2 = cx + r * Math.cos(endAngle - Math.PI/2);
          const y2 = cy + r * Math.sin(endAngle - Math.PI/2);
          return '<path d="M' + cx + ',' + cy + ' L' + x1 + ',' + y1 + ' A' + r + ',' + r + ' 0 ' + large + ',1 ' + x2 + ',' + y2 + ' Z" fill="' + color + '"/>';
        }

        let a1 = 0, a2 = proPct * 2 * Math.PI;
        let a3 = a2 + neutralPct * 2 * Math.PI;
        let a4 = a3 + antiPct * 2 * Math.PI;
        return '<svg width="160" height="160" viewBox="0 0 160 160">' +
          arc(a1, a2, '#15803d') +
          arc(a2, a3, '#d1d5db') +
          arc(a3, a4, '#c2410c') +
          '</svg>';
      }

        'us_house-13': 'Washington Heights, South Bronx',
        'us_house-14': 'Bronx, NE Queens, Bayside',
        'us_house-15': 'South Bronx, Central Bronx',
      };

      // NYC neighborhoods analysis
      const nycLegs = legs.filter(l => ['city_council', 'assembly', 'nyc_mayor'].includes(l.chamber) ||
        (l.chamber === 'senate' && [18, 20, 25, 26].includes(l.district)) ||
        (l.chamber === 'us_house' && [7, 8, 9, 12, 13, 14, 15].includes(l.district)));

      // Group neighborhoods by stance
      const neighborhoodScores = {};
      for (const l of legs) {
        const key = l.chamber + '-' + l.district;
        const hood = DISTRICT_NEIGHBORHOODS[key];
        if (!hood) continue;
        const hoods = hood.split(', ');
        for (const h of hoods) {
          if (!neighborhoodScores[h]) neighborhoodScores[h] = { total: 0, count: 0, anti: 0, pro: 0, reps: [] };
          neighborhoodScores[h].total += l.score;
          neighborhoodScores[h].count++;
          if (l.stance === 'strongly_oppose' || l.stance === 'oppose') neighborhoodScores[h].anti++;
          if (l.stance === 'strongly_support' || l.stance === 'support') neighborhoodScores[h].pro++;
          neighborhoodScores[h].reps.push(l);
        }
      }

      // Compute average score per rep
      for (const [_, d] of Object.entries(neighborhoodScores)) d.avg = d.count ? d.total / d.count : 0;
      const multiRep = Object.entries(neighborhoodScores).filter(([_, v]) => v.count >= 2);
      const sortedHoods = multiRep.sort((a, b) => a[1].avg - b[1].avg);
      const worstHoods = sortedHoods.slice(0, 8);
      const bestHoods = sortedHoods.filter(([_, v]) => v.avg > 0).sort((a, b) => b[1].avg - a[1].avg).slice(0, 10);

      // Worst neighborhoods
      html += `<div class="insight-card" id="worst-hoods">
        <h2>Worst NYC Neighborhoods for Israel Support</h2>
        <p style="font-size:14px;color:#64748b;margin-bottom:12px;">Areas where local elected officials have the strongest anti-Israel records.</p>
        <ul class="hotspot-list">`;
      let hoodId = 0;
      for (const [hood, data] of worstHoods) {
        const id = 'hood-w-' + (hoodId++);
        const slug = 'hood-' + hood.toLowerCase().replace(/[^a-z0-9]+/g, '-');
        const repsHtml = data.reps.map(r => {
          const sc = r.score > 0 ? '+' + r.score : r.score;
          const color = r.score >= 0 ? '#15803d' : '#c2410c';
          return `<div style="display:flex;align-items:center;padding:6px 0;gap:8px;cursor:pointer;" onclick="event.stopPropagation();openDetailPanel(${r.person_id})"><span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;color:white;background:${partyColor(r.party)}">${(r.party||'').includes('Democrat')?'D':'R'}</span><span style="flex:1;font-size:13px;font-weight:600;color:#0f172a;">${r.name}</span><span style="font-size:12px;color:#64748b;">${CHAMBER_LABELS[r.chamber]} D${r.district}</span><span style="font-size:13px;font-weight:700;color:${color};min-width:36px;text-align:right;">${sc}</span></div>`;
        }).join('');
        const avgW = data.avg.toFixed(1);
        html += `<li id="${slug}" style="cursor:pointer;" onclick="var el=document.getElementById('${id}');el.style.display=el.style.display==='none'?'block':'none';"><span class="name">${hood} <span style="color:#94a3b8;font-weight:400;font-size:12px;">${data.count} reps, ${data.anti} anti-Israel</span></span><span class="score" style="color:#c2410c">${avgW}</span><div id="${id}" style="display:none;margin-top:8px;padding-top:8px;border-top:1px solid #e2e8f0;">${repsHtml}</div></li>`;
      }
      html += `</ul>
        <div class="finding alert">These neighborhoods form a corridor through <strong>northern Brooklyn</strong> (Bushwick, Williamsburg, Sunset Park), the <strong>South Bronx</strong> (Mott Haven, Morrisania), and <strong>Jackson Heights/Elmhurst</strong> in Queens — areas with high DSA/progressive caucus alignment and significant immigrant and POC populations where anti-Israel sentiment has been channeled through left-progressive organizing.</div>
      </div>`;

      // Best neighborhoods
      if (bestHoods.length > 0) {
        html += `<div class="insight-card" id="best-hoods">
          <h2>Best NYC Neighborhoods for Israel Support</h2>
          <p style="font-size:14px;color:#64748b;margin-bottom:12px;">Areas where local elected officials have the strongest pro-Israel records.</p>
          <ul class="hotspot-list">`;
        for (const [hood, data] of bestHoods) {
          const id = 'hood-b-' + (hoodId++);
          const slug = 'hood-' + hood.toLowerCase().replace(/[^a-z0-9]+/g, '-');

            const sc = r.score > 0 ? '+' + r.score : r.score;

            return `<div style="display:flex;align-items:center;padding:6px 0;gap:8px;cursor:pointer;" onclick="event.stopPropagation();openDetailPanel(${r.person_id})"><span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;color:white;background:${partyColor(r.party)}">${(r.party||'').includes('Democrat')?'D':'R'}</span><span style="flex:1;font-size:13px;font-weight:600;color:#0f172a;">${r.name}</span><span style="font-size:12px;color:#64748b;">${CHAMBER_LABELS[r.chamber]} D${r.district}</span><span style="font-size:13px;font-weight:700;color:${color};min-width:36px;text-align:right;">${sc}</span></div>`;

          html += `<li id="${slug}" style="cursor:pointer;" onclick="var el=document.getElementById('${id}');el.style.display=el.style.display==='none'?'block':'none';"><span class="name">${hood} <span style="color:#94a3b8;font-weight:400;font-size:12px;">${data.count} reps, ${data.pro} pro-Israel</span></span><span class="score" style="color:#15803d">${avgB}</span><div id="${id}" style="display:none;margin-top:8px;padding-top:8px;border-top:1px solid #e2e8f0;">${repsHtml}</div></li>`;
        }
        html += `</ul>
          <div class="finding positive">Pro-Israel strength in NYC is concentrated in areas with significant <strong>Orthodox Jewish communities</strong> (Borough Park, Crown Heights) and <strong>moderate Democratic or Republican-leaning</strong> districts in southern Brooklyn and parts of Queens.</div>
        </div>`;
      }

      // Statewide best areas
      const upstateLegs = legs.filter(l => ['senate', 'assembly'].includes(l.chamber) && l.score > 3);
      html += `<div class="insight-card">
        <h2>Best of NY State (Outside NYC)</h2>
        <p style="font-size:14px;color:#64748b;margin-bottom:12px;">Pro-Israel strength across New York State is driven by Republican-held districts and moderate Democrats.</p>

      const proCriteria = topCriteria.filter(([l]) => critDir[l] === 'pro');
      const antiCriteria = topCriteria.filter(([l]) => critDir[l] === 'anti');

      html += `<div class="insight-card">

        <p style="font-size:14px;color:#64748b;margin-bottom:12px;">What legislators are actually doing — the most frequently documented positions.</p>

        <div style="font-size:12px;font-weight:700;color:#c2410c;text-transform:uppercase;margin:16px 0 8px;">Anti-Israel Actions</div>

          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count/maxCrit*100)}%;background:#c2410c">${count}</div></div>

      }
      html += `</div></div>`;

      // 2026 activity
      html += `<div class="insight-card">
        <h2>2026 Activity</h2>
        <div class="finding info">There have been <strong>${recent2026.length}</strong> documented Israel-related actions in 2026 so far, reflecting heightened activity around the <strong>Iran conflict</strong> and ongoing <strong>NYC Council antisemitism legislation</strong>.</div>
      </div>`;

      document.getElementById('insights-content').innerHTML = html;

      // Auto-expand neighborhood from hash (e.g. #hood-south-bronx)
      const hash = window.location.hash.slice(1);
      if (hash.startsWith('hood-')) {
        const li = document.getElementById(hash);
        if (li) {
          // Find the inner expandable div and show it
          const inner = li.querySelector('div[id^="hood-"]');
          if (inner) inner.style.display = 'block';
          li.scrollIntoView({ behavior: 'smooth', block: 'center' });
          li.style.background = '#fffbeb';
          setTimeout(() => { li.style.background = ''; }, 2000);
        }
      }
    }
