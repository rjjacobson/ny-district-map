<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New York State Legislative Districts</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .us-senate-label div {
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      text-align: center;
      text-shadow: 0 0 4px #fff, 0 0 4px #fff, 0 0 4px #fff;
      white-space: nowrap;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .top-nav {
      display: flex;
      align-items: center;
      background: #1e293b;
      padding: 0 20px;
      height: 44px;
      flex-shrink: 0;
      gap: 0;
    }
    .top-nav .site-title {
      font-size: 15px;
      font-weight: 700;
      color: white;
      margin-right: 24px;
      white-space: nowrap;
      text-decoration: none;
      flex-shrink: 0;
    }
    .top-nav .nav-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 16px;
      border-bottom: 3px solid transparent;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .top-nav .nav-link:hover { color: #e2e8f0; }
    .top-nav .nav-link.active { color: white; border-bottom-color: #3b82f6; }
    .nav-links { display: flex; align-items: center; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; flex: 1; }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-search { display: flex; gap: 4px; } .nav-search input { padding: 6px 12px; border: none; border-radius: 6px; font-size: 13px; width: 240px; outline: none; } .nav-search button { padding: 6px 14px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }

    .main-content { display: flex; flex: 1; overflow: hidden; }

    #map-container { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }

    .controls {
      position: absolute;
      top: 16px;
      left: 60px;
      right: 436px;
      z-index: 1000;
      display: flex;
      gap: 12px;
      align-items: stretch;
    }

    .control-group {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      padding: 8px 14px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .control-group-label {
      font-size: 10px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .control-group-buttons {
      display: flex;
      gap: 6px;
      flex: 1;
      align-items: stretch;
    }

    .toggle-btn {
      padding: 7px 16px;
      border: 2px solid #e0e0e0;
      background: white;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      color: #555;
      min-width: 80px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-btn:hover { border-color: #999; color: #333; }
    .toggle-btn.active { background: #2563eb; border-color: #2563eb; color: white; }

    /* Align Leaflet zoom control with controls bar */
    .leaflet-top.leaflet-left { top: 16px; left: 10px; }
    .leaflet-control-zoom {
      border: none !important;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15) !important;
      border-radius: 10px !important;
      overflow: hidden;
    }
    .leaflet-control-zoom a {
      width: 36px !important;
      height: 36px !important;
      line-height: 36px !important;
      font-size: 18px !important;
    }

    .legend {
      position: absolute;
      bottom: 24px;
      left: 16px;
      z-index: 1000;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      padding: 12px 16px;
      font-size: 12px;
      line-height: 1.5;
    }

    .legend-title { font-weight: 600; margin-bottom: 4px; font-size: 13px; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-swatch { width: 16px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.15); }

    /* Sidebar — expandable two-panel layout */
    #sidebar {
      width: 420px;
      min-width: 420px;
      height: 100vh;
      background: #fafafa;
      border-left: 1px solid #e5e5e5;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.25s ease;
    }

    #sidebar.detail-open {
      width: 680px;
      min-width: 680px;
    }

    #sidebar-header {
      padding: 12px 16px 10px;
      background: white;
      border-bottom: 1px solid #e5e5e5;
      flex-shrink: 0;
    }

    #search-input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    #search-input:focus { border-color: #2563eb; }
    #search-input::placeholder { color: #aaa; }

    #result-count { font-size: 12px; color: #888; margin-top: 6px; }

    #sidebar-panels {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Left: name list — full width by default, shrinks when detail open */
    #list-panel {
      flex: 1;
      overflow-y: auto;
      background: white;
      transition: flex 0.25s ease;
    }

    .detail-open #list-panel {
      flex: 0 0 280px;
      border-right: 1px solid #e5e5e5;
    }

    /* Right: detail panel — hidden by default */
    #detail-panel {
      flex: 1;
      overflow-y: auto;
      background: #fafafa;
      padding: 0;
      display: none;
    }

    .detail-open #detail-panel {
      display: block;
    }

    /* Detail card inside right panel */
    .detail-header {
      position: sticky; top: 0; z-index: 1; background: #fafafa;
      padding: 16px 20px 8px; border-bottom: 1px solid #eee;
    }
    .detail-header h2 { font-size: 20px; font-weight: 700; color: #1a1a1a; margin-bottom: 2px; }
    .detail-header .district-label { font-size: 13px; color: #888; font-weight: 500; display: flex; align-items: center; gap: 8px; }
    .party-pill {
      display: inline-block; padding: 2px 10px; border-radius: 12px;
      font-size: 11px; font-weight: 600; color: white;
    }
    .detail-header .close-btn {
      float: right; background: none; border: none; font-size: 20px;
      color: #aaa; cursor: pointer; padding: 0 4px; line-height: 1;
    }
    .detail-header .close-btn:hover { color: #333; }
    .detail-body { padding: 12px 20px 20px; }
    .detail-content { padding: 20px; }
    .detail-content h2 { font-size: 20px; font-weight: 700; color: #1a1a1a; margin-bottom: 2px; }
    .detail-content .district-label { font-size: 13px; color: #888; font-weight: 500; margin-bottom: 10px; }
    .detail-content .party-badge {
      display: inline-block; padding: 3px 12px; border-radius: 14px;
      font-size: 12px; font-weight: 600; color: white; margin-bottom: 12px;
    }
    .detail-content .close-btn {
      float: right; background: none; border: none; font-size: 20px;
      color: #aaa; cursor: pointer; padding: 0 4px; line-height: 1;
    }
    .detail-content .close-btn:hover { color: #333; }

    /* Collapsible contact */
    .contact-toggle {
      font-size: 13px; color: #555; cursor: pointer; margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px; font-weight: 500;
    }
    .contact-toggle:hover { color: #333; }
    .contact-details { font-size: 12px; color: #555; margin-bottom: 12px; padding-left: 4px; line-height: 1.8; }
    .contact-details a { color: #2563eb; text-decoration: none; }
    .contact-details a:hover { text-decoration: underline; }

    /* Stance badge */
    .stance-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .stance-badge {
      display: inline-block; padding: 6px 16px; border-radius: 8px;
      font-size: 13px; font-weight: 700; color: white;
    }
    .stance-meta { font-size: 12px; color: #888; }

    /* Evidence timeline */
    .evidence-title { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    .timeline { position: relative; padding-left: 24px; }
    .timeline::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: #e5e5e5; }
    .timeline-item { position: relative; margin-bottom: 16px; }
    .timeline-dot {
      position: absolute; left: -20px; top: 8px; width: 12px; height: 12px;
      border-radius: 50%; border: 2px solid white;
    }
    .timeline-card {
      background: white; border-radius: 8px; padding: 12px 14px;
      border-left: 3px solid #e5e5e5; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .timeline-card.pro { border-left-color: #15803d; }
    .timeline-card.anti { border-left-color: #c2410c; }
    .timeline-card .tc-header { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 4px; }
    .timeline-card .tc-title { font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
    .timeline-card .tc-desc { font-size: 12px; color: #666; line-height: 1.5; }
    .timeline-card .tc-source { font-size: 11px; color: #2563eb; margin-top: 6px; display: inline-block; }

    /* List rows */
    .leg-row {
      display: flex; align-items: center; padding: 7px 12px;
      border-bottom: 1px solid #f0f0f0; cursor: pointer;
      transition: background 0.15s; gap: 8px;
    }
    .leg-row:hover { background: #eef2ff; }
    .leg-row.highlighted { background: #dbeafe; }
    .leg-row.selected { background: #dbeafe; border-left: 3px solid #2563eb; }

    .leg-row .party-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .leg-row .district-num { font-size: 11px; color: #aaa; width: 24px; flex-shrink: 0; text-align: right; font-weight: 500; }
    .leg-row .leg-name { font-size: 13px; font-weight: 500; color: #1a1a1a; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .leg-row .evidence-count {
      font-size: 10px; color: #888; background: #f0f0f0; border-radius: 10px;
      padding: 1px 7px; flex-shrink: 0; font-weight: 600;
    }
    .leg-row .leg-tag { font-size: 11px; color: #888; flex-shrink: 0; }
    /* Hide tag text when detail panel is open (compact mode) */
    .detail-open .leg-row .leg-tag { display: none; }

    /* Loading */
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 2000;
      background: rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      font-size: 16px;
      color: #555;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Hide mobile-only elements on desktop */
    .mobile-close-filters { display: none; }

    /* Mobile filter toggle button */
    .mobile-filter-btn {
      display: none;
      position: fixed;
      top: 54px; right: 10px;
      z-index: 1000;
      background: white;
      border: none;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
    }

    /* Mobile search bar at bottom */
    .mobile-search {
      display: none;
      position: fixed;
      bottom: 10px; left: 10px; right: 10px;
      z-index: 1000;
    }
    .mobile-search input {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      font-size: 14px;
      outline: none;
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .nav-search { display: none !important; }

      /* Fixed nav bar */
      .top-nav {
        position: fixed !important;
        top: 0; left: 0; right: 0;
        z-index: 1002;
      }

      /* Push content below fixed nav */
      .main-content { flex-direction: column; margin-top: 44px; }

      /* Map takes full remaining height */
      #map-container { flex: 1; height: calc(100vh - 44px); }

      /* Hide sidebar entirely on mobile */
      #sidebar { display: none !important; }

      /* Hide controls and legend by default */
      .controls { display: none !important; }
      .controls.mobile-open {
        display: flex !important;
        position: fixed;
        top: 44px; left: 0; right: 0;
        z-index: 1001;
        background: rgba(255,255,255,0.97);
        padding: 16px;
        flex-direction: column;
        gap: 10px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      }
      .controls.mobile-open .mobile-close-filters {
        display: block;
        text-align: center;
        padding: 10px;
        font-size: 14px;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        border-top: 1px solid #e2e8f0;
        margin-top: 4px;
        background: none;
        border-left: none;
        border-right: none;
        border-bottom: none;
        width: 100%;
      }
      .controls.mobile-open .control-group {
        box-shadow: none;
        padding: 8px 0;
      }
      .controls.mobile-open .control-group-buttons {
        flex-wrap: wrap;
      }
      .controls.mobile-open .toggle-btn {
        padding: 10px 16px;
        font-size: 14px;
        min-width: auto;
      }

      .legend { display: none !important; }

      /* Show mobile-only elements */
      .mobile-filter-btn { display: block; }
      .mobile-search { display: block; }

      .top-nav .site-title { font-size: 13px; margin-right: 8px; }
      .top-nav .nav-link { font-size: 12px; padding: 10px 6px; }

      .leaflet-top.leaflet-left { top: 8px; left: 4px; }
      .leaflet-control-zoom a { width: 30px !important; height: 30px !important; line-height: 30px !important; font-size: 16px !important; }
    }

    @media (max-width: 480px) {
      .top-nav .nav-link { font-size: 10px; padding: 6px 3px; }
      .top-nav .site-title { font-size: 12px; margin-right: 6px; }
    }
  </style>

</head>
<body>
  <nav class="top-nav">
    <a href="index.html" class="site-title">ShalomNY</a>
    <div class="nav-links">
      <a href="stats.html" class="nav-link">Feed</a>

  <div class="main-content">
  <div id="map-container">
    <div id="map"></div>
    <button class="mobile-filter-btn" onclick="toggleMobileFilters()">Filters</button>
    <div class="mobile-search">
      <input type="text" id="mobile-search-input" placeholder="Search by name..." oninput="mobileSearch(this.value)" />

      <div class="control-group">

          <button class="toggle-btn" id="btn-senate" onclick="showLayer('senate')">State Senate</button>
          <button class="toggle-btn" id="btn-assembly" onclick="showLayer('assembly')">State Assembly</button>

        </div>

        <div class="control-group-buttons">
          <button class="toggle-btn" id="btn-color-party" onclick="setColorMode('party')">Party</button>

    <div class="legend" id="legend">

      <div class="legend-item"><span class="legend-swatch" style="background:#15803d"></span> Strongly Pro-Israel</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#4ade80"></span> Pro-Israel</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#a1a1aa"></span> Neutral</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#fb923c"></span> Anti-Israel</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#c2410c"></span> Strongly Anti-Israel</div>

      <div id="detail-panel" class="empty">Select a legislator</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Supabase config
    const SUPABASE_URL = 'https://xeknqkxhfxvveeyddokl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhla25xa3hoZnh2dmVleWRkb2tsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMjc1MzksImV4cCI6MjA5MDgwMzUzOX0.-CO0RkDBljPTRBO5x5JIAIZ23WfhR0A8bLJV3iE_xS0';

    // State
    let senateLayer = null, assemblyLayer = null, cityCouncilLayer = null, usHouseLayer = null, usSenateLayer = null;
    let senateData = null, assemblyData = null, cityCouncilData = null, usHouseData = null, usSenateData = null;
    let senateLegislators = [], assemblyLegislators = [], cityCouncilLegislators = [];
    let usHouseLegislators = [], usSenateLegislators = [];
    let nycMayorLegislators = [];
    let activeLayer = 'city_council';
    let selectedDistrict = null;
    let highlightedDistrict = null;
    let mapLayersByDistrict = { senate: {}, assembly: {}, city_council: {}, us_house: {}, us_senate: {} };

    const CHAMBER_LABELS = { senate: 'State Senate', assembly: 'Assembly', city_council: 'City Council', us_house: 'US House', us_senate: 'US Senate', nyc_mayor: 'NYC Mayor' };
    const CHAMBER_MEMBER_LABELS = { senate: 'state senators', assembly: 'assembly members', city_council: 'council members', us_house: 'representatives', us_senate: 'senators', nyc_mayor: 'mayor' };
    const ALL_CHAMBERS = ['us_senate', 'us_house', 'senate', 'assembly', 'city_council'];
    const NY_STATE_VIEW = { center: [42.85, -75.5], zoom: 7 };
    const NYC_VIEW = { center: [40.7128, -73.95], zoom: 11 };

    // Color mode: 'party' or 'israel'
    let colorMode = 'israel';
    // Positions data: person_id -> { stance, confidence, rationale }
    let positionsMap = {};
    // Person criteria: person_id -> [{ criterion_label, direction, category, evidence }]
    let personCriteriaMap = {};

    // Map
    const map = L.map('map', { center: [42.85, -75.5], zoom: 7, zoomControl: true, preferCanvas: true });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 18,
    }).addTo(map);

    // Colors
    const PARTY_COLORS = {
      'democrat': '#3b82f6', 'democratic': '#3b82f6',
      'republican': '#ef4444',
      'working families': '#a855f7',
      'conservative': '#b91c1c',
    };

    function partyColor(party) {
      if (!party) return '#9ca3af';
      const p = party.toLowerCase();
      for (const [key, color] of Object.entries(PARTY_COLORS)) {
        if (p.includes(key)) return color;
      }
      return '#9ca3af';
    }

    // Israel stance colors: green = pro-Israel, orange = anti-Israel
    const STANCE_COLORS = {
      'strongly_support': '#15803d',  // dark green
      'support':          '#4ade80',  // green
      'neutral':          '#a1a1aa',  // neutral gray
      'oppose':           '#fb923c',  // orange
      'strongly_oppose':  '#c2410c',  // dark orange
    };

    function stanceColor(personId) {
      const pos = positionsMap[personId];
      if (!pos || pos.confidence === 'unknown') return '#d1d5db'; // gray for unknown
      return STANCE_COLORS[pos.stance] || '#d1d5db';
    }

    const STANCE_LABEL_MAP = {
      'strongly_support': 'Strongly Pro-Israel',
      'support': 'Pro-Israel',
      'neutral': 'Neutral',
      'oppose': 'Anti-Israel',
      'strongly_oppose': 'Strongly Anti-Israel',
    };

    function stanceLabel(personId) {
      const pos = positionsMap[personId];
      if (!pos || pos.confidence === 'unknown') return 'Unknown';
      return STANCE_LABEL_MAP[pos.stance] || 'Unknown';
    }

    // Style
    function defaultStyle(feature) {
      const isSenateUS = feature.properties._CHAMBER === 'us_senate';
      if (colorMode === 'israel') {
        const personId = feature.properties.PERSON_ID;
        return {
          fillColor: stanceColor(personId),
          weight: isSenateUS ? 3 : 1.2,
          color: isSenateUS ? '#94a3b8' : '#fff',
          fillOpacity: isSenateUS ? 0.45 : 0.6,
          dashArray: isSenateUS ? '8 6' : null,
        };
      }
      return {
        fillColor: partyColor(feature.properties.PARTY),
        weight: isSenateUS ? 3 : 1.2,
        color: isSenateUS ? '#94a3b8' : '#fff',
        fillOpacity: isSenateUS ? 0.45 : 0.5,
        dashArray: isSenateUS ? '8 6' : null,
      };
    }

    function highlightStyle() {
      return { weight: 3, color: '#1e293b', fillOpacity: 0.75 };
    }

    function selectedStyle() {
      return { weight: 3, color: '#facc15', fillOpacity: 0.85 };
    }

    function getGeoLayerForChamber(chamber) {
      if (chamber === 'senate') return senateLayer;
      if (chamber === 'assembly') return assemblyLayer;
      if (chamber === 'us_house') return usHouseLayer;
      if (chamber === 'us_senate') return usSenateLayer;
      return cityCouncilLayer;
    }

    function getActiveGeoLayer() {
      return getGeoLayerForChamber(activeLayer);
    }

    function getLegislators(chamber) {
      if (chamber === 'senate') return senateLegislators;
      if (chamber === 'assembly') return assemblyLegislators;
      if (chamber === 'us_house') return usHouseLegislators;
      if (chamber === 'us_senate') return usSenateLegislators;
      if (chamber === 'nyc_mayor') return nycMayorLegislators;
      return cityCouncilLegislators;
    }

    // Detail card
    function showDetail(leg, chamber) {
      const ch = chamber || selectedChamber || activeLayer;
      document.getElementById('sidebar').classList.add('detail-open');
      setTimeout(() => map.invalidateSize(), 300);
      const panel = document.getElementById('detail-panel');
      const pos = positionsMap[leg.person_id];
      const hasStance = pos && pos.confidence !== 'unknown';
      const sColor = hasStance ? (STANCE_COLORS[pos.stance] || '#9ca3af') : '#d1d5db';
      const sLabel = hasStance ? (STANCE_LABEL_MAP[pos.stance] || 'Unknown') : 'Unknown';

      // Count evidence (criteria matches)
      const evidenceCount = personCriteriaMap[leg.person_id] ? personCriteriaMap[leg.person_id].length : 0;

      // Contact info
      let contactHTML = '';
      if (leg.phone_albany) contactHTML += `<div>Albany: ${leg.phone_albany}</div>`;
      if (leg.phone_district) contactHTML += `<div>District: ${leg.phone_district}</div>`;
      if (leg.email) contactHTML += `<div><a href="mailto:${leg.email}">${leg.email}</a></div>`;
      if (leg.website) contactHTML += `<div><a href="${leg.website}" target="_blank">${leg.website.replace(/^https?:\/\//, '')}</a></div>`;
      if (leg.start_date) contactHTML += `<div>Term: ${leg.start_date} — ${leg.end_date || 'present'}</div>`;

      // Evidence timeline
      let timelineHTML = '';
      const criteria = personCriteriaMap[leg.person_id] || [];
      if (criteria.length > 0) {
        timelineHTML = '<div class="evidence-title">Evidence Timeline</div><div class="timeline">';
        for (const c of criteria) {
          const isAnti = c.direction === 'anti';
          const dotColor = isAnti ? '#c2410c' : '#15803d';
          const cardClass = isAnti ? 'anti' : 'pro';
          const catLabel = (c.category || 'action').replace('_', ' ').toUpperCase();
          const dateStr = c.source_date || '';
          const dateDisplay = dateStr ? `<span style="color:#999;margin-left:8px">${dateStr}</span>` : '';
          const url = c.source_url || (c.evidence ? (c.evidence.match(/https?:\/\/[^\s),'"]+/) || [])[0] : null);
          const sourceLink = url ? `<a href="${url}" target="_blank" class="tc-source">View source &rarr;</a>` : '';
          // Clean evidence: remove URLs from display text
          const cleanEvidence = (c.evidence || '').replace(/https?:\/\/[^\s),'"]+/g, '').replace(/Sources?:\s*,?\s*$/i, '').trim();
          timelineHTML += `
            <div class="timeline-item">
              <div class="timeline-dot" style="background:${dotColor}"></div>
              <div class="timeline-card ${cardClass}">
                <div class="tc-header">${catLabel}${dateDisplay}</div>
                <div class="tc-title">${c.criterion_label}</div>
                ${cleanEvidence ? `<div class="tc-desc">${cleanEvidence}</div>` : ''}
                ${sourceLink}
              </div>
            </div>`;
        }
        timelineHTML += '</div>';
      }

      // AI rationale
      let rationaleHTML = '';
      if (pos && pos.rationale) {
        rationaleHTML = `<div style="margin-bottom:16px;font-size:12px;color:#666;line-height:1.5;padding:10px;background:white;border-radius:6px;border:1px solid #eee"><strong style="color:#444">AI Assessment:</strong> ${pos.rationale}</div>`;
      }

      panel.innerHTML = `
        <div class="detail-header">
          <button class="close-btn" onclick="clearSelection()">&times;</button>
          <h2>${leg.name}</h2>
          <div class="district-label">${ch === 'nyc_mayor' ? 'NYC Mayor' : `${CHAMBER_LABELS[ch]} District ${leg.district}`} <span class="party-pill" style="background:${partyColor(leg.party)}">${leg.party || 'Unknown'}</span></div>
        </div>
        <div class="detail-body">
          ${contactHTML ? `
            <div class="contact-toggle" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.querySelector('span').textContent=this.nextElementSibling.style.display==='none'?'\\u25B8':'\\u25BE'">
              <span>&#x25B8;</span> Contact Details
            </div>
            <div class="contact-details" style="display:none">${contactHTML}</div>
          ` : ''}
          <div class="stance-row">
            <span class="stance-badge" style="background:${sColor}">${sLabel}</span>
          </div>
          ${rationaleHTML}
          ${timelineHTML}
        </div>`;
    }

    function hideDetail() {
      document.getElementById('sidebar').classList.remove('detail-open');
      setTimeout(() => map.invalidateSize(), 300);
      const panel = document.getElementById('detail-panel');
      panel.innerHTML = '';
    }

    // Selection
    let selectedChamber = null;

    function clearSelection() {
      if (selectedDistrict !== null && selectedChamber) {
        const layer = mapLayersByDistrict[selectedChamber][selectedDistrict];
        if (layer) getGeoLayerForChamber(selectedChamber).resetStyle(layer);
      }
      selectedDistrict = null;
      selectedChamber = null;
      hideDetail();
      document.querySelectorAll('.leg-row.selected').forEach(el => el.classList.remove('selected'));
    }

    function selectDistrict(district, fromMap, chamber) {
      const ch = chamber || activeLayer;
      if (district === selectedDistrict && ch === selectedChamber) {
        clearSelection();
        return;
      }
      clearSelection();
      selectedDistrict = district;
      selectedChamber = ch;

      const layer = mapLayersByDistrict[ch][district];
      if (layer) {
        layer.setStyle(selectedStyle());
        layer.bringToFront();
        if (!fromMap) {
          map.fitBounds(layer.getBounds(), { padding: [60, 60], maxZoom: 13 });
        }
      }

      const legs = getLegislators(ch);
      const leg = legs.find(l => l.district === district);
      if (leg) {
        showDetail(leg, ch);
        // On mobile, also open the shared detail panel overlay
        if (window.innerWidth <= 768 && typeof openDetailPanel === 'function') {
          openDetailPanel(leg.person_id);
        }
      }

      const row = document.querySelector(`.leg-row[data-chamber="${ch}"][data-district="${district}"]`);
      if (row) {
        row.classList.add('selected');
        row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    // Map hover (from sidebar)
    let highlightedChamber = null;

    function highlightOnMap(district, chamber) {
      const ch = chamber || activeLayer;
      unhighlightOnMap();
      highlightedDistrict = district;
      highlightedChamber = ch;
      const layer = mapLayersByDistrict[ch][district];
      if (layer) {
        layer.setStyle(highlightStyle());
        layer.bringToFront();
      }
    }

    function unhighlightOnMap(chamber) {
      if (highlightedDistrict !== null) {
        const ch = highlightedChamber || chamber || activeLayer;
        if (!(highlightedDistrict === selectedDistrict && ch === selectedChamber)) {
          const layer = mapLayersByDistrict[ch][highlightedDistrict];
          if (layer) getGeoLayerForChamber(ch).resetStyle(layer);
        }
      }
      highlightedDistrict = null;
      highlightedChamber = null;
    }

    // Map events
    let hoveredMapLayer = null;
    let hoveredMapDistrict = null;

    function onFeatureClick(e) {
      const district = e.target.feature.properties.DISTRICT;
      const chamber = e.target.feature.properties._CHAMBER;
      selectDistrict(district, true, chamber);
    }

    function onFeatureMouseover(e) {
      const district = e.target.feature.properties.DISTRICT;
      const chamber = e.target.feature.properties._CHAMBER;

      // Clear previous hover first (mouseout can miss due to bringToFront z-order changes)
      if (hoveredMapLayer && hoveredMapDistrict !== district) {
        const prevChamber = hoveredMapLayer.feature.properties._CHAMBER;
        getGeoLayerForChamber(prevChamber).resetStyle(hoveredMapLayer);
      }
      if (hoveredMapDistrict !== null && hoveredMapDistrict !== district) {
        document.querySelectorAll('.leg-row.highlighted').forEach(el => el.classList.remove('highlighted'));
      }

      hoveredMapLayer = e.target;
      hoveredMapDistrict = district;

      if (district === selectedDistrict && chamber === (selectedChamber || activeLayer)) return;
      e.target.setStyle(highlightStyle());

      // Highlight sidebar row
      const row = document.querySelector(`.leg-row[data-chamber="${chamber}"][data-district="${district}"]`);
      if (row) row.classList.add('highlighted');
    }

    function onFeatureMouseout(e) {
      const district = e.target.feature.properties.DISTRICT;
      const chamber = e.target.feature.properties._CHAMBER;
      if (district === selectedDistrict && chamber === (selectedChamber || activeLayer)) return;
      getGeoLayerForChamber(chamber).resetStyle(e.target);
      const row = document.querySelector(`.leg-row[data-chamber="${chamber}"][data-district="${district}"]`);
      if (row) row.classList.remove('highlighted');

      if (hoveredMapDistrict === district) {
        hoveredMapLayer = null;
        hoveredMapDistrict = null;
      }
    }

    function onEachFeature(feature, layer) {
      layer.on({
        click: onFeatureClick,
        mouseover: onFeatureMouseover,
        mouseout: onFeatureMouseout,
      });
    }

    // US Senate name labels (markers)
    let usSenateLabels = [];

    function buildLayer(geojson, chamber) {
      mapLayersByDistrict[chamber] = {};
      const geoLayer = L.geoJSON(geojson, {
        style: defaultStyle,
        onEachFeature: (feature, layer) => {
          feature.properties._CHAMBER = chamber;
          mapLayersByDistrict[chamber][feature.properties.DISTRICT] = layer;
          onEachFeature(feature, layer);
        },
      });

      // Add name labels for US Senate halves
      if (chamber === 'us_senate') {
        usSenateLabels = [];
        for (const feature of geojson.features) {
          const name = feature.properties.NAME;
          if (!name) continue;
          const dist = feature.properties.DISTRICT;
          // Place label at a nice spot in each half
          const labelPos = dist === 1 ? [43.0, -77.5] : [41.5, -73.8];
          const marker = L.marker(labelPos, {
            icon: L.divIcon({
              className: 'us-senate-label',
              html: `<div>${name}</div>`,
              iconSize: [140, 30],
              iconAnchor: [70, 15],
            }),
            interactive: false,
          });
          usSenateLabels.push(marker);
          geoLayer.addLayer(marker);
        }
      }

      return geoLayer;
    }

    // Sidebar table
    function renderList() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const container = document.getElementById('list-panel');
      container.innerHTML = '';

      if (query) {
        // Search across ALL chambers
        const allChambers = [
          { key: 'us_senate', label: 'US Senate', legs: usSenateLegislators },
          { key: 'us_house', label: 'US House', legs: usHouseLegislators },
          { key: 'senate', label: 'State Senate', legs: senateLegislators },
          { key: 'assembly', label: 'Assembly', legs: assemblyLegislators },
          { key: 'nyc_mayor', label: 'NYC Mayor', legs: nycMayorLegislators },
          { key: 'city_council', label: 'City Council', legs: cityCouncilLegislators },
        ];
        let totalResults = 0;
        let totalAll = 0;

        for (const chamber of allChambers) {
          const filtered = chamber.legs.filter(l =>
            l.name.toLowerCase().includes(query) ||
            String(l.district).includes(query) ||
            (l.party && l.party.toLowerCase().includes(query))
          );
          totalResults += filtered.length;
          totalAll += chamber.legs.length;

          if (filtered.length > 0) {
            const header = document.createElement('div');
            header.style.cssText = 'padding:6px 16px;font-size:11px;font-weight:600;color:#888;background:#f0f0f0;text-transform:uppercase;letter-spacing:0.5px;';
            header.textContent = `${chamber.label} (${filtered.length})`;
            container.appendChild(header);

            for (const leg of filtered) {
              container.appendChild(createRow(leg, chamber.key));
            }
          }
        }

        document.getElementById('result-count').textContent = `${totalResults} results across all chambers`;
      } else {
        // No search — show active chamber
        let legs = [...getLegislators(activeLayer)].map(l => ({ ...l, _chamber: activeLayer }));
        let label = CHAMBER_MEMBER_LABELS[activeLayer];

        // Show NYC Mayor at top of city council view
        if (activeLayer === 'city_council' && nycMayorLegislators.length > 0) {
          const mayorHeader = document.createElement('div');
          mayorHeader.style.cssText = 'padding:6px 16px;font-size:11px;font-weight:600;color:#888;background:#f0f0f0;text-transform:uppercase;letter-spacing:0.5px;';
          mayorHeader.textContent = 'NYC Mayor';
          container.appendChild(mayorHeader);
          for (const m of nycMayorLegislators) {
            container.appendChild(createRow(m, 'nyc_mayor'));
          }
          const ccHeader = document.createElement('div');
          ccHeader.style.cssText = 'padding:6px 16px;font-size:11px;font-weight:600;color:#888;background:#f0f0f0;text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;';
          ccHeader.textContent = `Council Members (${legs.length})`;
          container.appendChild(ccHeader);
        }

        if (colorMode !== 'party') {
          // Sort by stance: strongly_support first → unknown last
          const STANCE_ORDER = { strongly_support: 0, support: 1, neutral: 2, oppose: 3, strongly_oppose: 4 };
          legs.sort((a, b) => {
            const pa = positionsMap[a.person_id];
            const pb = positionsMap[b.person_id];
            const oa = (pa && pa.confidence !== 'unknown') ? (STANCE_ORDER[pa.stance] ?? 5) : 5;
            const ob = (pb && pb.confidence !== 'unknown') ? (STANCE_ORDER[pb.stance] ?? 5) : 5;
            return oa - ob || a.district - b.district;
          });

          // Group by stance with section headers
          let lastStance = null;
          const STANCE_LABELS = {
            0: 'Strongly Pro-Israel', 1: 'Pro-Israel', 2: 'Neutral',
            3: 'Anti-Israel', 4: 'Strongly Anti-Israel', 5: 'Unknown'
          };
          for (const leg of legs) {
            const pa = positionsMap[leg.person_id];
            const order = (pa && pa.confidence !== 'unknown') ? (STANCE_ORDER[pa.stance] ?? 5) : 5;
            if (order !== lastStance) {
              lastStance = order;
              const count = legs.filter(l => {
                const p = positionsMap[l.person_id];
                const o = (p && p.confidence !== 'unknown') ? (STANCE_ORDER[p.stance] ?? 5) : 5;
                return o === order;
              }).length;
              const header = document.createElement('div');
              header.style.cssText = 'padding:6px 16px;font-size:11px;font-weight:600;color:#888;background:#f0f0f0;text-transform:uppercase;letter-spacing:0.5px;';
              header.textContent = `${STANCE_LABELS[order]} (${count})`;
              container.appendChild(header);
            }
            container.appendChild(createRow(leg, leg._chamber || activeLayer));
          }
        } else {
          for (const leg of legs) {
            container.appendChild(createRow(leg, activeLayer));
          }
        }

        document.getElementById('result-count').textContent = `${legs.length} ${label}`;
      }
    }

    function createRow(leg, chamber) {
      const row = document.createElement('div');
      row.className = 'leg-row';
      if (chamber === (selectedChamber || activeLayer) && leg.district === selectedDistrict) row.classList.add('selected');
      row.dataset.district = leg.district;
      row.dataset.chamber = chamber;
      const dotColor = colorMode === 'israel' ? stanceColor(leg.person_id) : partyColor(leg.party);
      const tagText = colorMode === 'israel' ? stanceLabel(leg.person_id) : (leg.party || '');
      row.innerHTML = `
        <span class="district-num">${chamber === 'nyc_mayor' ? '' : leg.district}</span>
        <span class="party-dot" style="background:${dotColor}"></span>
        <span class="leg-name">${leg.name}</span>
        <span class="leg-tag">${tagText}</span>
      `;
      if (chamber !== 'nyc_mayor') {
        row.addEventListener('mouseenter', () => {
          if (chamber === activeLayer) highlightOnMap(leg.district, chamber);
        });
        row.addEventListener('mouseleave', () => {
          if (chamber === activeLayer) unhighlightOnMap(chamber);
        });
      }
      row.addEventListener('click', () => {
        if (chamber === 'nyc_mayor') {
          // Mayor has no map district — just show detail panel
          showDetail(leg, 'nyc_mayor');
          return;
        }
        if (chamber !== activeLayer) {
          showLayer(chamber, true);
        }
        selectDistrict(leg.district, false, chamber);
      });
      return row;
    }

    // Search
    document.getElementById('search-input').addEventListener('input', renderList);

    // Layer toggle
    async function showLayer(which, keepSearch) {
      clearSelection();
      activeLayer = which;
      ALL_CHAMBERS.forEach(k => {
        document.getElementById('btn-' + k).className = k === which ? 'toggle-btn active' : 'toggle-btn';
      });
      if (!keepSearch) document.getElementById('search-input').value = '';

      // Remove all map layers
      if (senateLayer) map.removeLayer(senateLayer);
      if (assemblyLayer) map.removeLayer(assemblyLayer);
      if (cityCouncilLayer) map.removeLayer(cityCouncilLayer);
      if (usHouseLayer) map.removeLayer(usHouseLayer);
      if (usSenateLayer) map.removeLayer(usSenateLayer);

      // Show sidebar immediately (data already loaded)
      renderList();

      // Only zoom in (e.g. to NYC for city council), never zoom out
      const view = which === 'city_council' ? NYC_VIEW : NY_STATE_VIEW;
      if (view.zoom > map.getZoom()) {
        map.setView(view.center, view.zoom);
      }

      // Lazy-load GeoJSON if needed, then show
      await ensureGeoLayer(which);
      const layer = getGeoLayerForChamber(which);
      if (layer && activeLayer === which) layer.addTo(map);
    }

    // Color mode toggle
    function setColorMode(mode) {
      colorMode = mode;
      document.getElementById('btn-color-party').className = mode === 'party' ? 'toggle-btn active' : 'toggle-btn';
      document.getElementById('btn-color-israel').className = mode === 'israel' ? 'toggle-btn active' : 'toggle-btn';

      // Update legend
      const legend = document.getElementById('legend');
      if (mode === 'israel') {
        legend.innerHTML = `
          <div class="legend-title">Israel Stance</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#15803d"></span> Strongly Pro-Israel</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#4ade80"></span> Pro-Israel</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#a1a1aa"></span> Neutral</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#fb923c"></span> Anti-Israel</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#c2410c"></span> Strongly Anti-Israel</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#d1d5db"></span> Unknown</div>
        `;
      } else {
        legend.innerHTML = `
          <div class="legend-title">Party</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#3b82f6"></span> Democrat</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#ef4444"></span> Republican</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#9ca3af"></span> Other / Vacant</div>
        `;
      }

      // Re-style all layers
      if (senateLayer) senateLayer.setStyle(defaultStyle);
      if (assemblyLayer) assemblyLayer.setStyle(defaultStyle);
      if (cityCouncilLayer) cityCouncilLayer.setStyle(defaultStyle);
      if (usHouseLayer) usHouseLayer.setStyle(defaultStyle);

      // Re-apply selection if any
      if (selectedDistrict !== null) {
        const layer = mapLayersByDistrict[activeLayer][selectedDistrict];
        if (layer) layer.setStyle(selectedStyle());
      }

      renderList();
    }

    // Data fetching
    async function fetchLocalGeo(filename) {
      const resp = await fetch(`geo/${filename}`);
      if (!resp.ok) throw new Error(`Failed to fetch ${filename}: ${resp.status}`);
      return resp.json();
    }

    async function fetchSenateGeo() {
      return fetchLocalGeo('senate.geojson');
    }

    async function fetchAssemblyGeo() {
      return fetchLocalGeo('assembly.geojson');
    }

    async function fetchNYCCouncilGeo() {
      const data = await fetchLocalGeo('city_council.geojson');
      for (const f of data.features) {
        f.properties.DISTRICT = parseInt(f.properties.coundist);
      }
      return data;
    }

    async function fetchLegislators(chamber) {
      const resp = await fetch(
        `${SUPABASE_URL}/rest/v1/current_legislators?chamber=eq.${chamber}&select=person_id,district,name,party,website,phone_albany,phone_district,email,start_date,end_date&order=district`,
        { headers: { 'apikey': SUPABASE_ANON_KEY } }
      );
      if (!resp.ok) throw new Error(`Failed to fetch ${chamber} legislators`);
      return resp.json();
    }

    function mergeData(geojson, legislators) {
      const lookup = {};
      for (const leg of legislators) lookup[leg.district] = leg;
      for (const feature of geojson.features) {
        const dist = feature.properties.DISTRICT;
        const leg = lookup[dist];
        if (leg) {
          feature.properties.NAME = leg.name;
          feature.properties.PARTY = leg.party;
          feature.properties.PHONE = leg.phone_albany;
          feature.properties.DIST_PHONE = leg.phone_district;
          feature.properties.EMAIL = leg.email;
          feature.properties.PERSON_ID = leg.person_id;
        }
      }
      return geojson;
    }

    async function fetchUSHouseGeo() {
      const data = await fetchLocalGeo('us_house.geojson');
      for (const f of data.features) {
        f.properties.DISTRICT = parseInt(f.properties.BASENAME);
      }
      return data;
    }

    async function fetchPositions() {
      const resp = await fetch(
        `${SUPABASE_URL}/rest/v1/positions?select=person_id,stance,confidence,rationale&assessment_type=eq.ai&topic_id=eq.1`,
        { headers: { 'apikey': SUPABASE_ANON_KEY } }
      );
      if (!resp.ok) return {};
      const data = await resp.json();
      const m = {};
      for (const d of data) m[d.person_id] = d;
      return m;
    }

    async function fetchPersonCriteria() {
      const resp = await fetch(
        `${SUPABASE_URL}/rest/v1/person_criteria?select=person_id,evidence,source_url,source_date,criteria(label,direction,category)&order=person_id`,
        { headers: { 'apikey': SUPABASE_ANON_KEY } }
      );
      if (!resp.ok) return {};
      const data = await resp.json();
      const m = {};
      for (const d of data) {
        if (!m[d.person_id]) m[d.person_id] = [];
        m[d.person_id].push({
          criterion_label: d.criteria.label,
          direction: d.criteria.direction,
          category: d.criteria.category,
          evidence: d.evidence,
          source_url: d.source_url,
          source_date: d.source_date,
        });
      }
      // Sort each person's criteria by date (newest first), undated at end
      for (const pid of Object.keys(m)) {
        m[pid].sort((a, b) => {
          if (a.source_date && b.source_date) return b.source_date.localeCompare(a.source_date);
          if (a.source_date) return -1;
          if (b.source_date) return 1;
          return 0;
        });
      }
      return m;
    }

    async function fetchUSSenateGeo() {
      const data = await fetchLocalGeo('us_senate.geojson');
      for (const f of data.features) {
        f.properties.DISTRICT = parseInt(f.properties.DISTRICT || f.properties.BASENAME);
      }
      return data;
    }

    // Lazy-load GeoJSON for each chamber
    const geoLoaders = {
      senate: () => fetchSenateGeo(),
      assembly: () => fetchAssemblyGeo(),
      city_council: () => fetchNYCCouncilGeo(),
      us_house: () => fetchUSHouseGeo(),
      us_senate: () => fetchUSSenateGeo(),
    };
    const geoCache = {};

    async function ensureGeoLayer(chamber) {
      if (chamber === 'senate' && senateLayer) return;
      if (chamber === 'assembly' && assemblyLayer) return;
      if (chamber === 'city_council' && cityCouncilLayer) return;
      if (chamber === 'us_house' && usHouseLayer) return;
      if (chamber === 'us_senate' && usSenateLayer) return;

      const geo = geoCache[chamber] || await geoLoaders[chamber]();
      geoCache[chamber] = geo;
      const legs = getLegislators(chamber);
      const merged = mergeData(geo, legs);
      const layer = buildLayer(merged, chamber);

      if (chamber === 'senate') { senateData = merged; senateLayer = layer; }
      else if (chamber === 'assembly') { assemblyData = merged; assemblyLayer = layer; }
      else if (chamber === 'city_council') { cityCouncilData = merged; cityCouncilLayer = layer; }
      else if (chamber === 'us_house') { usHouseData = merged; usHouseLayer = layer; }
      else if (chamber === 'us_senate') { usSenateData = merged; usSenateLayer = layer; }
    }

    async function init() {
      try {
        // Step 1: Fetch lightweight Supabase data first (fast)
        const [sLeg, aLeg, ccLeg, uhLeg, usLeg, mayorLeg, positions, pCriteria] = await Promise.all([
          fetchLegislators('senate'),
          fetchLegislators('assembly'),
          fetchLegislators('city_council'),
          fetchLegislators('us_house'),
          fetchLegislators('us_senate'),
          fetchLegislators('nyc_mayor'),
          fetchPositions(),
          fetchPersonCriteria(),
        ]);

        positionsMap = positions;
        personCriteriaMap = pCriteria;
        senateLegislators = sLeg;
        assemblyLegislators = aLeg;
        cityCouncilLegislators = ccLeg;
        usHouseLegislators = uhLeg;
        usSenateLegislators = usLeg;
        nycMayorLegislators = mayorLeg;

        // Step 2: Show sidebar immediately
        renderList();

        // Step 3: Fetch default tab's GeoJSON (City Council) and set NYC view
        await ensureGeoLayer('city_council');
        cityCouncilLayer.addTo(map);
        map.setView([40.7128, -73.95], 11);

        document.getElementById('loading').style.display = 'none';
      } catch (err) {
        console.error(err);
        document.getElementById('loading').innerHTML = `
          <p style="color:#ef4444;font-weight:600;">Failed to load district data</p>
          <p style="font-size:14px;color:#888;">${err.message}</p>
          <p style="font-size:13px;color:#aaa;margin-top:8px;">Try refreshing the page.</p>
        `;
      }
    }

    init();

    // Mobile filter toggle
    function toggleMobileFilters() {
      const controls = document.querySelector('.controls');
      const btn = document.querySelector('.mobile-filter-btn');
      controls.classList.toggle('mobile-open');
      btn.textContent = controls.classList.contains('mobile-open') ? 'Close' : 'Filters';
    }
    function closeMobileFilters() {
      const controls = document.querySelector('.controls');
      const btn = document.querySelector('.mobile-filter-btn');
      controls.classList.remove('mobile-open');
      btn.textContent = 'Filters';
    }

    // Mobile search — search across all chambers, select the first match
    function mobileSearch(query) {
      if (!query || query.length < 2) return;
      query = query.toLowerCase();
      const allLegs = [
        ...usSenateLegislators.map(l => ({...l, _ch: 'us_senate'})),
        ...usHouseLegislators.map(l => ({...l, _ch: 'us_house'})),
        ...senateLegislators.map(l => ({...l, _ch: 'senate'})),
        ...assemblyLegislators.map(l => ({...l, _ch: 'assembly'})),
        ...cityCouncilLegislators.map(l => ({...l, _ch: 'city_council'})),
      ];
      const results = allLegs.filter(l => l.name.toLowerCase().includes(query));

      // Show results as a dropdown
      let dropdown = document.getElementById('mobile-search-results');
      if (!dropdown) {
        dropdown = document.createElement('div');
        dropdown.id = 'mobile-search-results';
        dropdown.style.cssText = 'position:absolute;bottom:52px;left:0;right:0;background:white;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,0.15);max-height:240px;overflow-y:auto;';
        document.querySelector('.mobile-search').appendChild(dropdown);
      }
      if (results.length === 0) { dropdown.innerHTML = '<div style="padding:12px;color:#94a3b8;font-size:14px;">No results</div>'; return; }
      dropdown.innerHTML = results.slice(0, 8).map(l => {
        const ch = CHAMBER_LABELS[l._ch] || l._ch;
        return `<div style="padding:10px 16px;cursor:pointer;border-bottom:1px solid #f1f5f9;font-size:14px;" onclick="mobileSelectLeg('${l._ch}',${l.district})">${l.name} <span style="color:#94a3b8;font-size:12px;">${ch} D${l.district}</span></div>`;
      }).join('');
    }

    function mobileSelectLeg(chamber, district) {
      // Close search results
      const dropdown = document.getElementById('mobile-search-results');
      if (dropdown) dropdown.remove();
      document.getElementById('mobile-search-input').value = '';
      // Switch to that chamber and select the district
      if (chamber !== activeLayer) {
        showLayer(chamber, true);
      }
      selectDistrict(district, false, chamber);
    }

    // Close mobile filters when clicking a filter button
    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => closeMobileFilters());
    });
  </script>
  <div id="detail-overlay" class="detail-overlay"><div id="detail-panel-content"></div></div>
  <script src="nav-lookup.js"></script>
  <script src="detail-panel.js"></script>
  </div>
</body>
</html>
